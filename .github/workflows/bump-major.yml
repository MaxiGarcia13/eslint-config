name: Bump major on main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Unit Tests
    uses: ./.github/workflows/test-unit.yml

  bump:
    needs: test
    uses: MaxiGarcia13/gh-actions/.github/workflows/bump-major.yml@main
    secrets: inherit

  publish:
    needs: bump
    uses: MaxiGarcia13/gh-actions/.github/workflows/npm-publish.yml@main
    secrets: inherit
    with:
      command: publish:npm
